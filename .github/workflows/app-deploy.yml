# Shared deploy job for Cloudflare Workers apps (see docs/app-ci.md).
# The app's own deploy script does the work: it refuses a dirty tree, applies
# the environment's migrations, deploys, and checks /health for the commit.
#
#   jobs:
#     deploy:
#       uses: santistebanc/skills/.github/workflows/app-deploy.yml@<commit>
#       with:
#         environment: staging
#         deploy: node scripts/deploy.mjs staging
#       secrets: inherit
#
# Call it from a workflow the app chooses: preview for a work branch, staging
# after a merge, production only from a release. Merging never deploys
# production by itself. The GitHub environment of the same name holds the
# secrets and any approval rule.
name: App deploy

on:
  workflow_call:
    inputs:
      environment:
        description: preview, staging or production.
        type: string
        required: true
      deploy:
        description: The app's deploy command for this environment.
        type: string
        required: true
      build:
        description: Optional build command before the deploy.
        type: string
        default: ''
      install:
        type: string
        default: npm ci --ignore-scripts
      node-version-file:
        type: string
        default: .nvmrc
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Known environment
        env:
          TARGET: ${{ inputs.environment }}
        run: case "$TARGET" in preview|staging|production) ;; *) echo "::error::Unknown environment $TARGET"; exit 2;; esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - env:
          INSTALL: ${{ inputs.install }}
        run: bash -eo pipefail -c "$INSTALL"
      - if: inputs.build != ''
        env:
          BUILD: ${{ inputs.build }}
        run: bash -eo pipefail -c "$BUILD"
      - env:
          DEPLOY: ${{ inputs.deploy }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bash -eo pipefail -c "$DEPLOY"
